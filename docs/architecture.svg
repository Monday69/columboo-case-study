<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture distribuée de Columboo</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">Tout s'exécute sur le réseau interne : aucun fragment de code ne sort vers une API cloud</text>

  <!-- Poste ingénieur -->
  <rect x="30" y="110" width="200" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Poste ingénieur</text>
  <text x="130" y="160" text-anchor="middle" font-size="12" fill="#6d28d9">Navigateur web</text>
  <text x="130" y="192" text-anchor="middle" font-size="12.5" fill="#1e293b">React 18 · TypeScript strict</text>
  <text x="130" y="212" text-anchor="middle" font-size="12.5" fill="#1e293b">~14 000 lignes</text>
  <text x="130" y="232" text-anchor="middle" font-size="12.5" fill="#1e293b">5 écrans de workflow</text>

  <!-- Serveur -->
  <rect x="330" y="95" width="300" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Serveur applicatif</text>
  <text x="480" y="145" text-anchor="middle" font-size="12" fill="#1d4ed8">Hôte Linux · FastAPI asynchrone</text>
  <rect x="350" y="162" width="260" height="34" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="480" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">API : 74 routes, 10 modules, Pydantic</text>
  <rect x="350" y="204" width="260" height="34" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="480" y="226" text-anchor="middle" font-size="12.5" fill="#1e293b">Pipelines d'audit et de remédiation</text>
  <rect x="350" y="246" width="260" height="34" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="480" y="268" text-anchor="middle" font-size="12.5" fill="#1e293b">Ordonnanceur GPU à priorités</text>
  <rect x="350" y="288" width="260" height="34" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="480" y="310" text-anchor="middle" font-size="12.5" fill="#1e293b">Grand Livre d'audit (JSON immuable)</text>
  <text x="480" y="350" text-anchor="middle" font-size="12" fill="#475569">~22 600 lignes Python · 259 tests pytest</text>
  <text x="480" y="370" text-anchor="middle" font-size="12" fill="#475569">Diffusion temps réel en Server-Sent Events</text>

  <!-- Inférence -->
  <rect x="730" y="95" width="200" height="140" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="830" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">Hôte d'inférence</text>
  <text x="830" y="145" text-anchor="middle" font-size="12" fill="#047857">Mac Mini Apple Silicon</text>
  <text x="830" y="177" text-anchor="middle" font-size="12.5" fill="#1e293b">Ollama (Metal)</text>
  <text x="830" y="197" text-anchor="middle" font-size="12.5" fill="#1e293b">Modèles open-weights 9B à 27B</text>
  <text x="830" y="217" text-anchor="middle" font-size="12.5" fill="#1e293b">Contexte 32k tokens</text>

  <!-- VM build -->
  <rect x="730" y="265" width="200" height="130" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="830" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Runner de build</text>
  <text x="830" y="315" text-anchor="middle" font-size="12" fill="#c2410c">VM Windows sous KVM</text>
  <text x="830" y="347" text-anchor="middle" font-size="12.5" fill="#1e293b">Micro-service HTTP</text>
  <text x="830" y="367" text-anchor="middle" font-size="12.5" fill="#1e293b">DCC32 (Delphi) · MSBuild (C#)</text>

  <!-- Flèches -->
  <line x1="232" y1="170" x2="326" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="279" y="160" text-anchor="middle" font-size="11" fill="#475569">REST</text>
  <line x1="326" y1="212" x2="234" y2="212" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="279" y="232" text-anchor="middle" font-size="11" fill="#475569">flux SSE</text>
  <line x1="632" y1="165" x2="726" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="679" y="155" text-anchor="middle" font-size="11" fill="#475569">inférence</text>
  <text x="679" y="185" text-anchor="middle" font-size="11" fill="#475569">1 modèle à la fois</text>
  <line x1="632" y1="330" x2="726" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="679" y="320" text-anchor="middle" font-size="11" fill="#475569">compilation</text>
  <text x="679" y="350" text-anchor="middle" font-size="11" fill="#475569">réseau privé</text>

  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#64748b">Schéma simplifié, redessiné pour ce portfolio</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
