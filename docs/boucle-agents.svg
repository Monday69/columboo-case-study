<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Boucle de remédiation multi-agents</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">Chaque agent a un rôle unique · température 0,2 · 3 tentatives maximum</text>

  <g font-size="12.5">
    <rect x="20" y="120" width="140" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="90" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Faille validée</text>
    <text x="90" y="174" text-anchor="middle" fill="#475569">par l'ingénieur</text>
    <text x="90" y="192" text-anchor="middle" fill="#475569">au triage</text>

    <rect x="200" y="120" width="150" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="275" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Planner</text>
    <text x="275" y="174" text-anchor="middle" fill="#1e293b">stratégie en étapes</text>
    <text x="275" y="192" text-anchor="middle" fill="#1e293b">sans écrire de code</text>

    <rect x="390" y="120" width="150" height="90" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="465" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Developer</text>
    <text x="465" y="174" text-anchor="middle" fill="#1e293b">hunks ciblés</text>
    <text x="465" y="192" text-anchor="middle" fill="#1e293b">sous budget de lignes</text>

    <rect x="580" y="120" width="150" height="90" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="655" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">Garde-fous</text>
    <text x="655" y="174" text-anchor="middle" fill="#1e293b">AST · budget</text>
    <text x="655" y="192" text-anchor="middle" fill="#1e293b">Reviewer (Lead Tech)</text>

    <rect x="770" y="120" width="170" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="855" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Patch accepté</text>
    <text x="855" y="174" text-anchor="middle" fill="#1e293b">compilation en VM</text>
    <text x="855" y="192" text-anchor="middle" fill="#1e293b">+ entrée au Grand Livre</text>
  </g>

  <line x1="162" y1="165" x2="196" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="352" y1="165" x2="386" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="542" y1="165" x2="576" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="732" y1="165" x2="766" y2="165" stroke="#059669" stroke-width="2" marker-end="url(#a)"/>
  <text x="749" y="155" text-anchor="middle" font-size="11" fill="#047857">OK</text>

  <path d="M655,212 C655,290 275,290 275,214" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="440" y="304" text-anchor="middle" font-size="12.5" fill="#b91c1c">Rejet : la critique est réinjectée</text><text x="440" y="321" text-anchor="middle" font-size="12.5" fill="#b91c1c">dans le contexte du Planner et du Developer</text>

  <path d="M655,212 L655,320 L855,320" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="770" y="300" width="170" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="855" y="319" text-anchor="middle" font-size="12" fill="#334155">Après 3 échecs :</text>
  <text x="855" y="336" text-anchor="middle" font-size="12" fill="#334155">arbitrage humain</text>

  <text x="480" y="380" text-anchor="middle" font-size="12" fill="#64748b">Sur 50 remédiations réelles : 72 % validées au 1er essai, 94 % en 2 passes au plus, 2 % renvoyées à l'humain</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
